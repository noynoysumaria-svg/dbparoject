<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New Student</title>
    <!-- Background overlay: buhinan ang brightness para mas clear ang picture -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <nav class="navbar">
      <a href="{{ url_for('index') }}" class="navbar-brand">STUDENT ENROLLED</a>
      <div>
        <a href="{{ url_for('logout') }}" class="btn btn-delete">Logout</a>
      </div>
    </nav>

    <div class="app-container">
      <div class="page-header">
        <div class="page-title">
          <h1>Add New Student</h1>
          <p>Fill in the required information to register a student</p>
        </div>
      </div>

      <div class="form-card">
        <form action="{{ url_for('add_student') }}" method="POST">
          <div class="form-grid">
            <div class="form-group">
              <label>Student ID *</label>
              <input
                type="text"
                name="student_id"
                placeholder="12-2345-6789 "
                required
              />
            </div>

            <div class="form-group">
              <label>Full Name *</label>
              <input type="text" name="fullname" placeholder required />
            </div>

            <div class="form-group">
              <label>Age</label>
              <input type="number" name="age" placeholder required />
            </div>

            <div class="form-group">
              <label>Gender</label>
              <select name="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </div>

            <div class="form-group">
              <label>Year Level</label>
              <select name="year_level">
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
              </select>
            </div>

            <div class="form-group">
              <label>Course</label>
              <input type="text" name="course" placeholder="BSIT...." />
            </div>

            <div class="form-group">
              <label>Contact Number</label>
              <input type="text" name="contact" placeholder="09123456789" />
            </div>

            <div class="form-group full-width">
              <label>Complete Address</label>
              <input
                type="text"
                name="address"
                placeholder="Street, City, Province"
              />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Student</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary"
              >Cancel</a
            >
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
